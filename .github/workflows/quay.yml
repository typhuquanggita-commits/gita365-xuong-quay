name: Xuong quay khop moi GITA365 (0 dong)
# Máy CPU miễn phí của GitHub Actions (kho công khai) quay cảnh nói
# khớp môi bằng SadTalker (mã nguồn mở, trọng số trên GitHub Releases).
# Việc lấy từ Worker GITA365; nộp MP4 H.264 về Worker (Cloudflare R2).
# KHÔNG in nội dung, KHÔNG đăng artifact — nhật ký kho này là công khai.
on:
  schedule:
    - cron: '*/10 * * * *'
  repository_dispatch:
    types: [quay]
  workflow_dispatch:

permissions:
  contents: read

env:
  API: https://gita365.typhuquanggita.workers.dev

jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ds: ${{ steps.d.outputs.ds }}
    steps:
      - id: d
        env:
          KHOA: ${{ secrets.GITA_KHOA_XUONG_QUAY }}
        run: |
          N=$(curl -fsS --max-time 20 -H "X-Khoa-Quay: $KHOA" "$API/quay/can" | python3 -c 'import sys,json;print(int(json.load(sys.stdin).get("can",0)))' 2>/dev/null || echo 0)
          echo "Can bat $N may"
          python3 -c 'import sys;n=max(0,min(20,int(sys.argv[1])));print("ds="+str(list(range(1,n+1))).replace(" ",""))' "$N" >> "$GITHUB_OUTPUT"

  thu-rife:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Thu RIFE tren CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers unzip
          curl -fsSL -o /tmp/rife.zip https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-ubuntu.zip
          unzip -q /tmp/rife.zip -d /tmp/rife-src
          cd /tmp/rife-src/rife-ncnn-vulkan-20221029-ubuntu
          chmod +x rife-ncnn-vulkan
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp*' | head -1)
          echo "ICD=$ICD"
          test -n "$ICD"
          export VK_ICD_FILENAMES="$ICD" VK_DRIVER_FILES="$ICD"
          ffmpeg -y -loglevel error -f lavfi -i "color=c=red:s=320x480" -frames:v 1 /tmp/a.jpg
          ffmpeg -y -loglevel error -f lavfi -i "color=c=blue:s=320x480" -frames:v 1 /tmp/b.jpg
          ./rife-ncnn-vulkan -0 /tmp/a.jpg -1 /tmp/b.jpg -o /tmp/giua.png -m rife-v4 -s 0.5
          test -s /tmp/giua.png
          echo "RIFE ok $(wc -c < /tmp/giua.png) byte"

  quay:
    needs: dem
    if: needs.dem.outputs.ds != '[]' && needs.dem.outputs.ds != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        so: ${{ fromJSON(needs.dem.outputs.ds) }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.8' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/tro
          key: sadtalker-cpu-v1
      - name: Lay SadTalker + trong so
        run: |
          set -e
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git st
          mkdir -p ~/tro/checkpoints ~/tro/weights
          B=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors; do
            [ -s ~/tro/checkpoints/$f ] || curl -fsSL -o ~/tro/checkpoints/$f $B/$f; done
          [ -s ~/tro/weights/alignment_WFLW_4HG.pth ] || curl -fsSL -o ~/tro/weights/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          [ -s ~/tro/weights/detection_Resnet50_Final.pth ] || curl -fsSL -o ~/tro/weights/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          [ -s ~/tro/weights/parsing_parsenet.pth ] || curl -fsSL -o ~/tro/weights/parsing_parsenet.pth https://github.com/sczhou/CodeFormer/releases/download/v0.1.0/parsing_parsenet.pth
          mkdir -p st/gfpgan
          ln -s ~/tro/checkpoints st/checkpoints
          ln -s ~/tro/weights st/gfpgan/weights
      - name: Cai thu vien (CPU)
        run: |
          set -e
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          cd st
          pip -q install torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          pip -q install -r requirements.txt
      - name: Lay RIFE
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers unzip
          curl -fsSL -o /tmp/rife.zip https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-ubuntu.zip
          unzip -q /tmp/rife.zip -d /tmp/rife-src
          mkdir -p "$HOME/rife"
          cp -a /tmp/rife-src/rife-ncnn-vulkan-20221029-ubuntu/. "$HOME/rife/"
          chmod +x "$HOME/rife/rife-ncnn-vulkan"
      - name: Nhan viec va quay
        env:
          KHOA: ${{ secrets.GITA_KHOA_XUONG_QUAY }}
        run: |
          set -u
          cd st
          MAY="gh-${GITHUB_RUN_ID}-${{ matrix.so }}"
          H="X-Khoa-Quay: $KHOA"
          JS="Content-Type: application/json"
          ( while true; do curl -s -o /dev/null --max-time 20 -X POST -H "$H" -H "$JS" -d "{\"may\":\"$MAY\"}" "$API/quay/song"; sleep 60; done ) &
          bao_loi () { curl -s -o /dev/null --max-time 30 -X POST -H "$H" -H "$JS" -d "{\"loi\":\"$2\",\"tamThoi\":$3}" "$API/quay/loi/$1"; }
          T0=$(date +%s); RONG=0; XONG=0
          while [ $(( $(date +%s) - T0 )) -lt 15600 ]; do
            J=$(curl -fsS --max-time 30 -X POST -H "$H" -H "$JS" -d "{\"may\":\"$MAY\"}" "$API/quay/nhan") || { sleep 30; continue; }
            MA=$(echo "$J" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("ma") or "")')
            if [ -z "$MA" ]; then
              RONG=$((RONG+1)); [ $RONG -ge 6 ] && break
              sleep 30; continue
            fi
            RONG=0
            DU=$(echo "$J" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("duoiAnh") or "jpg")')
            LOAI=$(echo "$J" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("loai") or "moi")')
            rm -rf /tmp/v; mkdir -p /tmp/v
            if [ "$LOAI" = "cd" ]; then
              DU2=$(echo "$J" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("duoiCd") or "jpg")')
              if ! curl -fsS --max-time 120 -H "$H" -o "/tmp/v/a.$DU" "$API/quay/tep/$MA/anh" || \
                 ! curl -fsS --max-time 120 -H "$H" -o "/tmp/v/b.$DU2" "$API/quay/tep/$MA/cd"; then
                bao_loi "$MA" "Khong tai duoc hai khung." true; continue
              fi
              ICD=$(find /usr/share/vulkan/icd.d -name 'lvp*' | head -1)
              export VK_ICD_FILENAMES="${ICD:-}" VK_DRIVER_FILES="${ICD:-}"
              ffmpeg -y -loglevel error -i "/tmp/v/a.$DU" -vf "scale=576:1024:force_original_aspect_ratio=increase,crop=576:1024" /tmp/v/a.jpg
              ffmpeg -y -loglevel error -i "/tmp/v/b.$DU2" -vf "scale=576:1024:force_original_aspect_ratio=increase,crop=576:1024" /tmp/v/b.jpg
              mkdir -p /tmp/v/in /tmp/v/out
              cp /tmp/v/a.jpg /tmp/v/in/00000001.jpg
              cp /tmp/v/b.jpg /tmp/v/in/00000002.jpg
              if "$HOME/rife/rife-ncnn-vulkan" -i /tmp/v/in -o /tmp/v/out -n 16 -m "$HOME/rife/rife-v4" > /tmp/v/nhat-ky 2>&1 \
                 && ffmpeg -y -loglevel error -framerate 8 -i /tmp/v/out/%08d.png -c:v libx264 -preset veryfast -crf 18 \
                      -pix_fmt yuv420p -movflags +faststart /tmp/v/ra.mp4; then
                if curl -fsS --max-time 300 -X PUT -H "$H" -H "Content-Type: video/mp4" --data-binary @/tmp/v/ra.mp4 "$API/quay/kq/$MA" > /dev/null; then
                  XONG=$((XONG+1)); echo "Xong 1 canh chuyen dong"
                else bao_loi "$MA" "Nop ket qua khong duoc." true; fi
              else bao_loi "$MA" "Khong noi duoc chuyen dong." true; fi
              continue
            fi
            if ! curl -fsS --max-time 120 -H "$H" -o "/tmp/v/vao.$DU" "$API/quay/tep/$MA/anh" || \
               ! curl -fsS --max-time 120 -H "$H" -o /tmp/v/am.wav "$API/quay/tep/$MA/am"; then
              bao_loi "$MA" "Khong tai duoc tep." true; continue
            fi
            ffmpeg -y -loglevel error -i "/tmp/v/vao.$DU" /tmp/v/anh.png || { bao_loi "$MA" "Anh hong." false; continue; }
            B=$(date +%s)
            if python inference.py --driven_audio /tmp/v/am.wav --source_image /tmp/v/anh.png \
                 --result_dir /tmp/v/kq --still --preprocess full --size 256 --cpu > /tmp/v/nhat-ky 2>&1; then
              F=$(find /tmp/v/kq -name '*_full.mp4' | head -1); [ -n "$F" ] || F=$(find /tmp/v/kq -name '*.mp4' | head -1)
              if [ -n "$F" ] && ffmpeg -y -loglevel error -i "$F" -an -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p \
                   -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -movflags +faststart /tmp/v/ra.mp4; then
                if curl -fsS --max-time 300 -X PUT -H "$H" -H "Content-Type: video/mp4" --data-binary @/tmp/v/ra.mp4 "$API/quay/kq/$MA" > /dev/null; then
                  XONG=$((XONG+1)); echo "Xong 1 canh sau $(( $(date +%s) - B ))s"
                else bao_loi "$MA" "Nop ket qua khong duoc." true; fi
              else bao_loi "$MA" "Khong ra duoc video." false; fi
            else
              if grep -qi "face" /tmp/v/nhat-ky; then bao_loi "$MA" "Khong thay khuon mat ro trong khung hinh." false
              else bao_loi "$MA" "May quay gap loi." true; fi
            fi
          done
          echo "Tong canh da quay: $XONG"
